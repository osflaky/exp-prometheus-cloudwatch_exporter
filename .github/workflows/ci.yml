name: CI

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    name: Maven build [${{ matrix.expander_leg }}]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      with:
        persist-credentials: false
    - name: Set up JDK 25
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95   # v5.6.0
      with:
        java-version: "25"
        distribution: ${{ matrix.distribution || 'temurin' }}
        architecture: ${{ matrix.arch == 'arm64' && 'aarch64' || 'x64' }}
        cache: maven
    - name: Check formatting
      run: ./mvnw -B fmt:check
    - name: Build and verify
      run: ./mvnw -B verify
    - name: Update dependency graph
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      uses: 
        advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8       # v5.0.0

    timeout-minutes: 150
